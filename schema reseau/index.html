saveAllBtn.addEventListener("click", saveAllChanges);
async function saveAllChanges() {
  const updates = {};

  Object.entries(pendingCustomDevices).forEach(([id, device]) => {
    updates[`customDevices/${id}`] = device;
  });

  Object.entries(pendingOverrides).forEach(([id, device]) => {
    updates[`deviceOverrides/${id}`] = device;
  });

  pendingDeletes.forEach(id => {
    updates[`customDevices/${id}`] = null;
  });

  console.log("updates to save:", updates);

  if (!Object.keys(updates).length) {
    showMessage("Information", "Aucune modification à enregistrer.");
    return;
  }

  try {
    removeUndefinedValues(updates);
    await database.ref().update(updates);

    pendingCustomDevices = {};
    pendingOverrides = {};
    pendingDeletes = [];

    showMessage("Succès", "Modifications enregistrées avec succès.");
  } catch (error) {
    console.error(error);
    showMessage("Erreur", "Impossible d’enregistrer les modifications.");
  }
}
function removeUndefinedValues(object) {
  Object.keys(object).forEach(key => {
    if (object[key] === undefined) {
      object[key] = "";
    }

    if (object[key] && typeof object[key] === "object") {
      removeUndefinedValues(object[key]);
    }
  });
}

function isDeletedOrHiddenSwitch(switchId) {
  if (!switchId) return true;

  if (isSpecialIsolatedSwitch(switchId)) {
    return false;
  }

  const customDevices = {
    ...customDevicesCache,
    ...pendingCustomDevices
  };

  pendingDeletes.forEach(id => {
    delete customDevices[id];
  });

  const movedOrCustomSwitch = Object.values(customDevices).find(device =>
    device.type === "switch" &&
    sameSwitchName(device.id, switchId) &&
    !device.hidden
  );

  if (movedOrCustomSwitch) {
    return false;
  }

  const originalSwitch = allDevices.find(device =>
    sameSwitchName(device.id, switchId)
  );

  if (originalSwitch && getDeviceWithOverride(originalSwitch).hidden) {
    return true;
  }

  const directCustomSwitch = customDevices[switchId];

  if (directCustomSwitch && directCustomSwitch.hidden) {
    return true;
  }

  return false;
}

function searchEquipment() {
  const text = normalizeSearchText(searchInput.value);

  if (!text) {
    showMessage("Recherche", "Veuillez saisir un ID, un nom ou une IP.");
    return;
  }

  clearSearchHighlight();

  const originalResults = allDevices
  .map(getDeviceWithOverride)
  .filter(device => !device.hidden)
  .filter(device => {
    const id = normalizeSearchText(device.id);
    const name = normalizeSearchText(device.name);
    const ip = normalizeSearchText(device.ip);
    const switchIp = normalizeSearchText(device.switchIp);

    return id.includes(text) ||
      name.includes(text) ||
      ip.includes(text) ||
      switchIp.includes(text);
  });

  const customResults = Object.values({
    ...customDevicesCache,
    ...pendingCustomDevices
  })
    .filter(device => !pendingDeletes.includes(device.id))
    .filter(device => {
      const id = normalizeSearchText(device.id);
      const name = normalizeSearchText(device.name);
      const ip = normalizeSearchText(device.ip);
      const switchIp = normalizeSearchText(device.switchIp);

      return id.includes(text) ||
        name.includes(text) ||
        ip.includes(text) ||
        switchIp.includes(text);
    });

  const total = originalResults.length + customResults.length;

  if (!total) {
    showMessage("Recherche", "Aucun équipement trouvé.");
    return;
  }

  originalResults.forEach(highlightOriginalDevice);
  customResults.forEach(highlightCustomDevice);

  const firstDevice = originalResults[0] || customResults[0];

  details({
    ...firstDevice,
    isCustom: Boolean(firstDevice.type)
  });
}
function normalizeSearchText(value) {
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "")
    .replaceAll("-", "")
    .replaceAll("_", "")
    .replaceAll(":", "");
}
function clearSearchHighlight() {
  document.querySelectorAll(".search-highlight").forEach(element => {
    element.classList.remove("search-highlight");
  });

  if (customLayer) {
    customLayer.querySelectorAll(".search-highlight-svg").forEach(element => {
      element.remove();
    });
  }
}

function highlightOriginalDevice(device) {
  const svg = svgContainer.querySelector("svg");
  if (!svg || !customLayer) return;

  const shape = svg.querySelector(`[data-cell-id="${cssspace(device.id)}"]`);
  if (!shape) return;

  const box = shape.getBBox();

  const marker = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  marker.setAttribute("class", "search-highlight-svg");
  marker.setAttribute("x", box.x - 6);
  marker.setAttribute("y", box.y - 6);
  marker.setAttribute("width", box.width + 10);
  marker.setAttribute("height", box.height + 10);
  marker.setAttribute("rx", 6);
  marker.setAttribute("fill", "none");
  marker.setAttribute("stroke", "#80a4c9");
  marker.setAttribute("stroke-width", "4");

  customLayer.appendChild(marker);

  const viewer = document.getElementById("viewer");
  viewer.scrollTo({
    left: Math.max(0, box.x - viewer.clientWidth / 2),
    top: Math.max(0, box.y - viewer.clientHeight / 2),
    behavior: "smooth"
  });
}
function highlightCustomDevice(device) {
  if (!customLayer) return;

  const isSwitch = device.type === "switch";
  const width = isSwitch ? 60 : 15;
  const height = isSwitch ? 42 : 15;

  const marker = document.createElementNS("http://www.w3.org/2000/svg", "rect");

  marker.setAttribute("class", "search-highlight-svg");
  marker.setAttribute("x", Number(device.x) - width / 2 - 6);
  marker.setAttribute("y", Number(device.y) - height / 2 - 6);
  marker.setAttribute("width", width + 10);
  marker.setAttribute("height", height + 10);
  marker.setAttribute("rx", 6);
  marker.setAttribute("fill", "none");
  marker.setAttribute("stroke", "#80a4c9");
  marker.setAttribute("stroke-width", "4");

  customLayer.appendChild(marker);
}

function removeOnlyBlackOriginalWires(svg) {
  allEdges.forEach(edge => {
    const edgeElements = svg.querySelectorAll(`[data-cell-id="${cssspace(edge.id)}"]`);

    edgeElements.forEach(element => {
      const blackParts = element.querySelectorAll(
        `path[stroke="#000000"],
         path[stroke="black"],
         path[stroke="#000"],
         line[stroke="#000000"],
         line[stroke="black"],
         line[stroke="#000"]`
      );

      if (blackParts.length > 0) {
        element.remove();
      }
    });
  });
}
function createCustomLayer(svg) {
  customLayer = document.createElementNS("http://www.w3.org/2000/svg", "svg");

  const width = svg.getAttribute("width") || svg.viewBox.baseVal.width;
  const height = svg.getAttribute("height") || svg.viewBox.baseVal.height;
  const viewBox = svg.getAttribute("viewBox");

  customLayer.setAttribute("id", "customLayer");
  customLayer.setAttribute("width", width);
  customLayer.setAttribute("height", height);

  if (viewBox) {
    customLayer.setAttribute("viewBox", viewBox);
  }

  svgContainer.appendChild(customLayer);
}

function hideSvgElement(element, shouldHide) {

function getSwitchCableSidePoint(switchPosition, pcPosition) {
  const width = switchPosition.width || 45;
  const height = switchPosition.height || 32;
  const insideOffset = 10;

  const left = switchPosition.x - width / 2 + insideOffset;
  const right = switchPosition.x + width / 2 - insideOffset;
  const top = switchPosition.y - height / 2;
  const bottom = switchPosition.y + height / 2;

  const side = pcPosition.x < switchPosition.x ? "left" : "right";

  return {
    x: side === "left" ? left : right,
    y: Math.max(top, Math.min(bottom, pcPosition.y))
  };
}
function findOriginalDevicePosition(id) {
  const svg = svgContainer.querySelector("svg");
  const shape = svg.querySelector(`[data-cell-id="${cssspace(id)}"]`);

  if (!shape) return null;

  const box = shape.getBBox();

  return {
    id: id,
    x: box.x + box.width / 2,
    y: box.y + box.height / 2,
    topY: box.y,
    width: box.width,
    height: box.height
  };
}

function updateRelatedPcsIfSwitchChanged(oldSwitch, newSwitch) {
  const isSwitch = oldSwitch.id.toLowerCase().includes("switch");

  if (!isSwitch) return;

  const oldId = oldSwitch.id;
  const newId = newSwitch.id;
  const newIp = newSwitch.ip || "";

  Object.values(customDevicesCache || {}).forEach(device => {
    if (device.type === "pc" && device.switchName === oldId) {
      pendingCustomDevices[device.id] = {
        ...device,
        switchName: newId,
        switchIp: newIp
      };
    }
  });

  Object.values(pendingCustomDevices || {}).forEach(device => {
    if (device.type === "pc" && device.switchName === oldId) {
      pendingCustomDevices[device.id] = {
        ...device,
        switchName: newId,
        switchIp: newIp
      };
    }
  });

  allDevices.forEach(device => {
    if (device.switchName === oldId) {
      pendingOverrides[device.id] = {
        ...getDeviceWithOverride(device),
        switchName: newId,
        switchIp: newIp
      };
    }
  });
}
function deviceIdExists(id) {
  const wanted = id.toLowerCase();

  const existsInOriginal = allDevices
    .map(getDeviceWithOverride)
    .filter(device => !device.hidden)
    .some(device => device.id.toLowerCase() === wanted);

  const existsInCustom = Object.values({
    ...customDevicesCache,
    ...pendingCustomDevices
  })
    .filter(device => !pendingDeletes.includes(device.id))
    .some(device =>
      device.id && device.id.toLowerCase() === wanted
    );

  return existsInOriginal || existsInCustom;
}
function switchNumberExists(number, ignoredId = "") {
  const wanted = String(number || "").trim().toLowerCase();
  const ignored = String(ignoredId || "").trim().toLowerCase();

  if (!wanted) return false;

  const originalSwitches = allDevices
    .map(getDeviceWithOverride)
    .filter(device => !device.hidden);

  const customSwitches = Object.values({
    ...customDevicesCache,
    ...pendingCustomDevices
  })
    .filter(device => !pendingDeletes.includes(device.id));

  const allSwitches = [...originalSwitches, ...customSwitches];

  return allSwitches.some(device => {
    if (!device || !device.id) return false;
    if (device.id.toLowerCase() === ignored) return false;
    if (!device.id.toLowerCase().includes("switch")) return false;

    const parts = readSwitchIdParts(device.id);
    return parts.number.toLowerCase() === wanted;
  });
}

  text.setAttribute("y", Number(device.y) + 14);
  text.setAttribute("text-anchor", "middle");
  text.textContent = device.id;

  group.appendChild(text);
  customLayer.appendChild(group);

  group.addEventListener("click", event => {
    event.stopPropagation();
    event.preventDefault();

    cleardevice();
    group.classList.add("selected-device");

    details({
      ...device,
      type: deviceType,
      isCustom: true
    });
  });
}
function sameSwitchName(a, b) {
  return normalizeSwitchText(a) === normalizeSwitchText(b);
}

function normalizeSwitchText(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .replace(/\s*:\s*/g, ":")
    .trim();
}
function isSpecialIsolatedSwitch(id) {
  const specialSwitches = [
    "switch SW025: HP ARUBA 1930-48G JL685A",
    "switch SW005: HP 1920-24G JG924A"
  ];

  return specialSwitches.some(sw =>
    normalizeSpecialSwitchId(id) === normalizeSpecialSwitchId(sw)
  );
}

function normalizeSpecialSwitchId(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .replace(/\s*:\s*/g, ":")
    .trim();
}

function getCustomDevicePosition(device) {
  const isSwitch = device.type === "switch";

  return {
    id: device.id,
    x: Number(device.x),
    y: Number(device.y),
    width: isSwitch ? 45 : 15,
    height: isSwitch ? 32 : 15
  };
}

function drawWireBetweenDevices(fromDevice, toDevice, className) {
  const start = getSideEdgePoint(fromDevice, toDevice);
  const end = getSideEdgePoint(toDevice, fromDevice);

  drawLine(start.x, start.y, end.x, end.y, className);
}

function getSideEdgePoint(fromDevice, toDevice) {
  const width = fromDevice.width || 45;
  const height = fromDevice.height || 32;

  const isSwitch = String(fromDevice.id || "").toLowerCase().includes("switch");

  if (isSwitch) {
    const otherIsLeft = toDevice.x < fromDevice.x;

    return {
      x: otherIsLeft ? fromDevice.x - width / 2 : fromDevice.x + width / 2,
      y: fromDevice.y
    };
  }

  return {
    x: fromDevice.x,
    y: fromDevice.y - height / 2
  };
}
function drawPcIcon(group, x, y) {
  drawImageIcon(group, "computer.png", x, y, 15, 15);
}

function drawSwitchIcon(group, x, y) {
  drawImageIcon(group, "switch.png", x, y, 45, 32);
}

function drawImageIcon(group, src, x, y, width, height) {
  const image = document.createElementNS("http://www.w3.org/2000/svg", "image");

  image.setAttribute("href", src);
  image.setAttribute("x", x - width / 2);
  image.setAttribute("y", y - height / 2);
  image.setAttribute("width", width);
  image.setAttribute("height", height);

  group.appendChild(image);
}

function drawLine(x1, y1, x2, y2, className = "custom-line") {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

  line.setAttribute("class", className);
  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);

  customLayer.appendChild(line);
}


function findClosestSwitch(x, y) {
  const svg = svgContainer.querySelector("svg");

  const originalSwitches = allDevices
    .map(getDeviceWithOverride)
    .filter(device => !device.hidden)
    .filter(device => device.id.toLowerCase().includes("switch"))
    .map(device => {
      const shape = svg.querySelector(`[data-cell-id="${cssspace(device.id)}"]`);

      if (!shape) return null;

      const box = shape.getBBox();

      return {
        id: device.id,
        x: box.x + box.width / 2,
        y: box.y + box.height / 2,
        width: box.width,
        height: box.height
      };
    })
    .filter(Boolean);

  const customSwitches = Object.values({
    ...customDevicesCache,
    ...pendingCustomDevices
  })
    .filter(device => device.type === "switch")
    .filter(device => !device.hidden)
    .filter(device => !pendingDeletes.includes(device.id))
    .filter(device => Number(device.x) !== Number(x) || Number(device.y) !== Number(y))
    .map(device => ({
      id: device.id,
      x: Number(device.x),
      y: Number(device.y),
      width: 45,
      height: 32
    }));

  const switches = [...originalSwitches, ...customSwitches];

  if (!switches.length) return null;

  return switches
    .map(sw => ({
      ...sw,
      distance: Math.hypot(sw.x - x, sw.y - y)
    }))
    .sort((a, b) => a.distance - b.distance)[0];
}

function findSwitchPosition(switchId) {
  const customDevices = {
    ...customDevicesCache,
    ...pendingCustomDevices
  };

  pendingDeletes.forEach(id => {
    delete customDevices[id];
  });

  const movedOrCustomSwitch = Object.values(customDevices).find(device =>
    device.type === "switch" &&
    device.id === switchId &&
    !device.hidden
  );

  if (movedOrCustomSwitch) {
    return {
      id: movedOrCustomSwitch.id,
      x: Number(movedOrCustomSwitch.x),
      y: Number(movedOrCustomSwitch.y),
      width: 45,
      height: 32
    };
  }

  const originalDevice = allDevices.find(device => device.id === switchId);
  if (!originalDevice) return null;

  const currentSwitch = getDeviceWithOverride(originalDevice);

  if (currentSwitch.hidden) {
    return null;
  }

  const svg = svgContainer.querySelector("svg");
  const originalSwitch = svg.querySelector(`[data-cell-id="${cssspace(switchId)}"]`);

  if (!originalSwitch) return null;

  const box = originalSwitch.getBBox();

  return {
    id: switchId,
    x: box.x + box.width / 2,
    y: box.y + box.height / 2,
    width: box.width,
    height: box.height
  };
}
